name: Test ProxyIP (SG)

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "节点列表文件(仓库内路径)"
        required: false
        default: "SG.txt"
      concurrency:
        description: "并发数"
        required: false
        default: "30"
      timeout:
        description: "单请求超时秒数"
        required: false
        default: "6"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python (from pyproject.toml)
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run ProxyIP test
        run: |
          uv run main.py "${{ inputs.input_file }}" \
            -c "${{ inputs.concurrency }}" \
            -t "${{ inputs.timeout }}" \
            -o "proxyip_report.csv"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxyip-report
          path: proxyip_report.csv
          retention-days: 14
